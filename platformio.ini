[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI is configured entirely via these build flags instead of editing
; the library's User_Setup.h directly — keeps the config in version control
; and avoids fragile edits inside .pio's cached library copy.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480

    ; Display SPI pins
    -D TFT_MISO=12
    -D TFT_MOSI=11
    -D TFT_SCLK=13
    -D TFT_CS=10
    -D TFT_DC=8
    -D TFT_RST=9

    ; Touch controller (XPT2046) — shares the display's SPI bus,
    ; only needs its own CS line
    -D TOUCH_CS=6

    ; Fonts (trim this list later once you know which you actually use —
    ; each LOAD_FONT adds to flash size)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    ; SPI speeds — display can run fast; touch (XPT2046) is limited to ~2.5MHz
    -D SPI_FREQUENCY=40000000
    -D SPI_TOUCH_FREQUENCY=2500000